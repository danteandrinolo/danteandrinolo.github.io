    Experience:
      - company: University of Southern California, with Prof. Justin P. Haldar
        position: "Research: Advanced Signal Processing Methods for MRI Reconstruction"
        location: Los Angeles, California
        start_date: 2025-08
        end_date: present
        summary: Advanced signal processing techniques for characterization and inverse problem solving in MRI reconstruction.

      - company: INVAP, advised by Dr. Martín Hurtado
        position: Supervised Professional Practice (remote)
        start_date: 2023-09
        end_date: 2024-03
        highlights:
          - Developed an algorithm to maximize the minimum blind velocity in a pulsed radar based on multiple PRF selection.
          - Inspired by "Medium PRF set selection using evolutionary algorithm", formulated the problem and applied stochastic optimization algorithms such as Particle Swarm Optimization and the Genetic Algorithm.
          - Compared the algorithm against other methods, achieving better results.

      - company: UNLP, with Dr. Santiago Ozafrain
        position: "Research: Reflectometry Signal Processing for Galileo Signals"
        location: La Plata, Argentina
        start_date: 2023-08
        end_date: 2024-02
        summary: GNSS signal processing project, part of a university CubeSat development project. Published as first author in a conference paper and presented at GCURS, Rice University.
        highlights:
          - Learned and validated conventional signal processing techniques for GPS L1/C reflectometry signals using NASA CYGNSS public raw data and metadata.
          - Formulated, extended and validated the signal processing for the Galileo E1 civil signal.
          - Developed an algorithm to process all CYGNSS public data related to ocean and Amazon basin reflectometry events, and generated a dataset that is public for science users.

      - company: UNLP, with Dr. Mariano Fernández-Corazza and Prof. Carlos H. Muravchik
        position: "Undergraduate Thesis: Optimized tES for TTFields"
        location: La Plata, Argentina
        start_date: 2022-11
        end_date: 2024-02
        summary: Optimal transcranial electrical stimulation (tES) for tumor treating fields. Part of the work was published as first author in a conference paper.
        highlights:
          - Learned and validated the theory of the forward and inverse problems in tES (and the analogous EEG source localization problem), using the Finite Element Method as numerical solver for Maxwell's equations.
          - Simulated tES in realistic head models based on the ICBM-152 atlas with an added tumor, and developed optimization algorithms to maximize the directionality and intensity of the electric field within the tumor.
          - Compared the optimized solutions with the conventional ad hoc protocol, achieving successful results.
          - Formulated and simulated a probabilistic model of cancer cell death to quantify the improvement of the optimal method over the conventional protocol.

